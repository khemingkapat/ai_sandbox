<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPC Portal - Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .login-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>HPC Portal Login</h2>
        <form action="/login" method="POST">
            <label for="username">Select User:</label>
            <select name="username" id="username">
                <!-- Go Template Loop -->
                {{ range .users }}
                    <option value="{{ . }}">{{ . }}</option>
                {{ end }}
            </select>
            
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
