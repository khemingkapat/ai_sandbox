<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HPC Portal — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --surface: #111318;
    --border: #1e2229;
    --border-bright: #2d3340;
    --accent: #00d4aa;
    --accent-dim: rgba(0,212,170,0.12);
    --text: #e2e8f0;
    --text-dim: #64748b;
    --text-muted: #334155;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,170,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,170,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    padding: 36px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 2px;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .logo-title {
    font-family: var(--sans);
    font-size: 26px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.02em;
    margin-bottom: 24px;
  }

  .logo-title span { color: var(--accent); }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
    display: block;
  }

  .form-input {
    width: 100%;
    padding: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.15s;
  }

  .form-input:focus {
    border-color: var(--accent);
  }

  .session-note {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 20px;
    line-height: 1.6;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 2px;
  }

  .session-note span { color: var(--accent); }

  .btn-login {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s ease;
    position: relative;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .btn-login::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    transform: translateX(-100%);
    transition: transform 0.2s ease;
  }

  .btn-login:hover::before { transform: translateX(0); }
  .btn-login:hover { color: var(--bg); }
  .btn-login span { position: relative; z-index: 1; }

  .demo-section {
    border-top: 1px solid var(--border);
    padding-top: 18px;
  }

  .demo-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .demo-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .btn-demo {
    background: var(--bg);
    border: 1px solid var(--border-bright);
    color: var(--text);
    padding: 8px 12px;
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    border-radius: 2px;
    text-align: left;
    transition: all 0.15s;
  }

  .btn-demo:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo-label">Local HPC Cluster</div>
  <h1 class="logo-title">HPC <span>Portal</span></h1>

  <form method="POST" action="/login" id="login-form">
    <div class="form-group">
      <label for="jwt_token">// University SSO / JWT Token</label>
      <input type="password" name="jwt_token" id="jwt_token" class="form-input" placeholder="eyJhbGciOiJIUzI1NiIsIn..." required>
    </div>

    <div class="session-note">
      Single external JWT pipeline with self-service project provisioning.
    </div>

    <button type="submit" class="btn-login" id="login-btn">
      <span>→ Verify & Login</span>
    </button>
  </form>

  <div class="demo-section">
    <div class="demo-label">// Quick Launch Seeded Identities</div>
    <div class="demo-grid">
      {{ range $user, $token := .demoTokens }}
      <button type="button" class="btn-demo" onclick="useDemoToken('{{ $token }}')">
        {{ $user }}
      </button>
      {{ end }}
    </div>
  </div>
</div>

<script>
  function useDemoToken(token) {
    document.getElementById("jwt_token").value = token;
    document.getElementById("login-form").submit();
  }
</script>
</body>
</html>
