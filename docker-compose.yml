services:
  # 1. Central LDAP Database
  openldap:
    image: osixia/openldap:latest
    container_name: openldap-server
    environment:
      LDAP_DOMAIN: "sandbox.local"
      LDAP_ORGANISATION: "Sandbox"
      LDAP_ADMIN_PASSWORD: "adminpass"
    ports:
      - "389:389"
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    networks:
      - sandbox-net
    restart: unless-stopped

  # 2. Test Node with SSSD client
  sssd-client:
    image: nslcd-client-test
    container_name: sss-node
    build:
      context: .
      dockerfile: Dockerfile
    # Mount your host storage folder to simulate Shared Storage (NFS)
    volumes:
      - ./storage:/mnt/storage
    networks:
      - sandbox-net
    depends_on:
      - openldap
    restart: unless-stopped

volumes:
  ldap-data:
    driver: local
  ldap-config:
    driver: local

networks:
  sandbox-net:
    driver: bridge
