name: Stage 1 — Cloud Linters & Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: cloud-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-docs-and-mermaid:
    name: Docs & Mermaid Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint Mermaid Diagrams (Syntax AST)
        run: |
          python3 scripts/lint-mermaid.py

  lint-shell:
    name: Shell Scripts Syntax & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash Syntax (bash -n)
        run: |
          bash -n scripts/*.sh

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"
          severity: error

  test-portal-go:
    name: Go Portal Linters & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: portal/go.sum

      - name: Go Vet
        run: |
          cd portal && go vet ./...

      - name: Golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          cd portal && golangci-lint run

      - name: Go Unit Tests with Race Detector
        run: |
          cd portal && go test -v -race ./...

  lint-k8s:
    name: Kubernetes Manifest Schema & Security Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Set up Kube-linter
        run: |
          curl -sL https://github.com/stackrox/kube-linter/releases/download/v0.7.2/kube-linter-linux.tar.gz | tar xz kube-linter
          sudo mv kube-linter /usr/local/bin/

      - name: Validate Kubernetes Manifests
        run: |
          bash scripts/lint-k8s.sh
