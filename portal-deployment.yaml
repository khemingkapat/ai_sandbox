apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpc-portal
  namespace: slurm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpc-portal
  template:
    metadata:
      labels:
        app: hpc-portal
    spec:
      containers:
      - name: portal
        image: hpc-portal:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: ui
        env:
        - name: SLURMRESTD_URL
          value: "http://slurmrestd:6820"
        - name: JWT_KEY_PATH
          value: "/etc/slurm/jwt_hs256.key"
        - name: TRAEFIK_CONFIG_DIR
          value: "/etc/traefik/dynamic"
        - name: PORT_DB_PATH
          value: "/var/lib/portal/leases.db"
        volumeMounts:
        - name: storage
          mountPath: /mnt/storage
        - name: jwt-key
          mountPath: /etc/slurm/jwt_hs256.key
          subPath: jwt.key
          readOnly: true
        - name: traefik-dynamic
          mountPath: /etc/traefik/dynamic
      - name: traefik
        image: traefik:v3.1
        args:
        - --providers.file.directory=/etc/traefik/dynamic
        - --providers.file.watch=true
        - --entrypoints.web.address=:80
        ports:
        - containerPort: 80
          name: proxy
        volumeMounts:
        - name: traefik-dynamic
          mountPath: /etc/traefik/dynamic
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: slinky-storage-pvc
      - name: jwt-key
        secret:
          secretName: slurm-auth-jwt
      - name: traefik-dynamic
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: slurm
spec:
  selector:
    app: hpc-portal
  ports:
  - name: ui
    port: 8080
    targetPort: 8080
  - name: proxy
    port: 80
    targetPort: 80
