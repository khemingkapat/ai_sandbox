# slurm.conf configured for AI Sandbox

ClusterName=local_cluster
ControlMachine=slurmctld
ControlAddr=slurmctld

# Authentication and Security
AuthType=auth/munge
CredType=cred/munge

# State and Logs
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid

SlurmctldDebug=debug2
SlurmdDebug=debug2

# Scheduling and Priorities (Multifactor & Fair-share)
PriorityType=priority/multifactor
PriorityWeightFairshare=10000

# Accounting database backend (slurmdbd)
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurm-accounting
AccountingStoragePort=6819

# Process tracking
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none

# Compute Nodes
NodeName=worker[1-3] State=UNKNOWN CPUs=8 Boards=1 SocketsPerBoard=1 CoresPerSocket=8 ThreadsPerCore=1 RealMemory=500

# Partitions with PreemptMode=OFF and limits from Capacity Planning
PartitionName=interactive Nodes=worker[1-3] Default=YES MaxTime=02:00:00 State=UP PriorityTier=2 PreemptMode=OFF MaxTRESPerJob=cpu=4,mem=16G,gres/gpu=1
PartitionName=batch-cpu Nodes=worker[1-2] Default=NO MaxTime=24:00:00 State=UP PriorityTier=1 PreemptMode=OFF MaxTRESPerJob=cpu=16,mem=64G
PartitionName=batch-gpu Nodes=worker[3] Default=NO MaxTime=7-00:00:00 State=UP PriorityTier=1 PreemptMode=OFF MaxTRESPerJob=cpu=16,mem=64G,gres/gpu=1
PartitionName=inference Nodes=worker[3] Default=NO MaxTime=12:00:00 State=UP PriorityTier=3 PreemptMode=OFF MaxTRESPerJob=cpu=4,mem=32G,gres/gpu=1
