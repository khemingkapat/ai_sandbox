# MariaDB for Slurm Accounting (WP3-1-5)
# Deployed as a standalone StatefulSet in the slurm namespace.
# The Slinky Helm chart's slurmdbd will connect to this DB.
---
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-password
  namespace: slurm
type: Opaque
data:
  # "slurmpassword" base64-encoded
  password: c2x1cm1wYXNzd29yZA==
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: slurm
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/part-of: slurm-accounting
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "rootpassword"
        - name: MYSQL_DATABASE
          value: "slurm_acct_db"
        - name: MYSQL_USER
          value: "slurm"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-password
              key: password
        volumeMounts:
        - name: mariadb-data
          mountPath: /var/lib/mysql
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - -u
            - root
            - -prootpassword
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: mariadb-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: slurm
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/part-of: slurm-accounting
spec:
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql
  selector:
    app.kubernetes.io/name: mariadb
