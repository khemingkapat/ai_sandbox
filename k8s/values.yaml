    PartitionName=batch-cpu Nodes=slurmd-cpu,ai-worker1 MaxTime=1-00:00:00 OverSubscribe=YES PreemptMode=OFF PriorityTier=1 State=UP
    PartitionName=batch-gpu Nodes=slurmd-cpu,slurmd-gpu,ai-worker1,ai-sandbox-gpu-vm MaxTime=7-00:00:00 OverSubscribe=YES PreemptMode=OFF PriorityTier=1 State=UP
    PartitionName=inference Nodes=slurmd-gpu,ai-sandbox-gpu-vm MaxTime=12:00:00 OverSubscribe=YES PreemptMode=OFF PriorityTier=3 State=UP
    PartitionName=interactive Nodes=slurmd-cpu,slurmd-gpu,ai-worker1,ai-sandbox-gpu-vm Default=YES MaxTime=02:00:00 OverSubscribe=YES PreemptMode=OFF PriorityTier=2 State=UP
  extraConfMap: {}
  metadata: {}
