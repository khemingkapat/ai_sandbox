    scalingMode: StatefulSet
    replicas: 2
    oversubscribeNode: true
    taintKubeNodes: false
    workloadDisruptionProtection: true
    ordinalPadding: 0
    slurmd: &id001
      image:
        repository: slurmd-custom
        tag: latest
      args: []
      env: []
      securityContext:
        privileged: false
        capabilities:
          add:
            - SYS_ADMIN
            - DAC_OVERRIDE
            - DAC_READ_SEARCH
      resources: {}
      volumeMounts:
      - name: slinky-storage
        mountPath: /mnt/storage
      - name: extrausers-vol
        mountPath: /var/lib/extrausers
        subPath: common/etc
        readOnly: true
    logfile: &id002
      image:
        repository: docker.io/library/alpine
        tag: latest
      resources: {}
    extraConf: null
    extraConfMap: &id003 {}
    partition: &id004
      enabled: false
      config: null
      configMap: {}
    ssh: &id005
      enabled: false
      extraSshdConfig: null
    updateStrategy: &id006
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 25%
    metadata: &id007 {}
    podSpec: &id008
      resources: {}
      initContainers: []
      nodeSelector:
        kubernetes.io/hostname: ai-worker1
      affinity: {}
      tolerations:
      - key: "slinky.slurm.net/managed-node"
        operator: "Exists"
        effect: "NoExecute"
      volumes:
      - name: slinky-storage
        persistentVolumeClaim:
