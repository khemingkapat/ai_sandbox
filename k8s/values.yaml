      - name: extrausers-vol
        persistentVolumeClaim:
          claimName: slinky-storage-pvc
  slurmd-gpu:
    enabled: true
    scalingMode: StatefulSet
    replicas: 1
    oversubscribeNode: true
    taintKubeNodes: false
    workloadDisruptionProtection: true
    ordinalPadding: 0
    slurmd:
      image:
        repository: slurmd-custom
        tag: latest
      args: []
      env:
      - name: NVIDIA_DRIVER_CAPABILITIES
        value: compute,utility,all
      securityContext:
        privileged: false
        capabilities:
          add:
            - SYS_ADMIN
            - DAC_OVERRIDE
            - DAC_READ_SEARCH
      resources:
        limits:
          nvidia.com/gpu: 1
        requests:
          nvidia.com/gpu: 1
      volumeMounts:
      - name: slinky-storage
        mountPath: /mnt/storage
      - name: extrausers-vol
        mountPath: /var/lib/extrausers
        subPath: common/etc
        readOnly: true
    logfile: *id002
    extraConf: "Gres=gpu:1"
    extraConfMap: *id003
    partition: *id004
    ssh: *id005
    updateStrategy: *id006
    podSpec:
      resources: {}
      runtimeClassName: nvidia
      initContainers: []
      nodeSelector:
        kubernetes.io/hostname: ai-sandbox-gpu-vm
        kubernetes.io/os: linux
      affinity: {}
      tolerations:
      - key: "slinky.slurm.net/managed-node"
        operator: "Exists"
        effect: "NoExecute"
      volumes:
      - name: slinky-storage
        persistentVolumeClaim:
