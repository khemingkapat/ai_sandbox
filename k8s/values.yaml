epilogScripts:
  01-webhook.sh: "#!/bin/bash\n# Slurm Epilog script to send job metrics to the central\
    \ portal\n# Try reaching the host machine using host.minikube.internal or a known\
    \ docker bridge IP.\n# Usually in kind/minikube, 10.0.2.2 or host.minikube.internal\
    \ works, or the actual node IP.\nCENTRAL_PORTAL_URL=\"http://172.17.0.1:8080/api/webhook/slurm\"\
    \n# or just try reaching the portal container if the python server runs on the\
    \ host?\n# Actually, we can use the k8s node IP or host machine IP. Let's use\
    \ the env variables.\n\nJOB_ID=${SLURM_JOB_ID:-unknown}\nUSER_ID=${SLURM_JOB_USER:-unknown}\n\
    ACCOUNT=${SLURM_JOB_ACCOUNT:-unknown}\nPARTITION=${SLURM_JOB_PARTITION:-unknown}\n\
    NODELIST=${SLURM_JOB_NODELIST:-unknown}\n\nPAYLOAD=$(cat <<EOF\n{\n  \"job_id\"\
    : \"$JOB_ID\",\n  \"user\": \"$USER_ID\",\n  \"account\": \"$ACCOUNT\",\n  \"\
    partition\": \"$PARTITION\",\n  \"nodelist\": \"$NODELIST\",\n  \"event\": \"\
    job_completed\",\n  \"timestamp\": \"$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")\"\n}\n\
    EOF\n)\n\ncurl -X POST -H \"Content-Type: application/json\" -d \"$PAYLOAD\" \"\
    http://host.k3d.internal:8080/api/webhook/slurm\" --max-time 5 || true\ncurl -X\
    \ POST -H \"Content-Type: application/json\" -d \"$PAYLOAD\" \"http://host.minikube.internal:8080/api/webhook/slurm\"\
    \ --max-time 5 || true\ncurl -X POST -H \"Content-Type: application/json\" -d\
    \ \"$PAYLOAD\" \"http://172.17.0.1:8080/api/webhook/slurm\" --max-time 5 || true\n\
    curl -X POST -H \"Content-Type: application/json\" -d \"$PAYLOAD\" \"http://localhost:8080/api/webhook/slurm\"\
    \ --max-time 5 || true\n"
