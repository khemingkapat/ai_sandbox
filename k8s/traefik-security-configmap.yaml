apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-security-config
  namespace: slurm
data:
  security.yaml: |
    tls:
      stores:
        default:
          defaultCertificate:
            certFile: /etc/traefik/certs/tls.crt
            keyFile: /etc/traefik/certs/tls.key

    http:
      routers:
        vllm-api:
          entryPoints:
            - websecure
          rule: "PathPrefix(`/v1`)"
          service: vllm-backend
          priority: 100
          middlewares:
            - vllm-strip-user-header
            - vllm-forwardauth
            - vllm-ratelimit
            - vllm-inflight
        mlflow:
          entryPoints:
            - web
            - websecure
          rule: "PathPrefix(`/mlflow`) || PathPrefix(`/api/2.0`) || PathPrefix(`/ajax-api`) || PathPrefix(`/get-artifact`)"
          service: mlflow-backend
          priority: 50
        portal:
          entryPoints:
            - websecure
          rule: "PathPrefix(`/`)"
          service: portal-ui
          priority: 1
        portal-redirect:
          entryPoints:
            - web
          rule: "PathPrefix(`/`)"
          service: portal-ui
          priority: 1
          middlewares:
            - redirect-to-https
      services:
        portal-ui:
          loadBalancer:
            servers:
              - url: "http://127.0.0.1:8080"
        vllm-backend:
          loadBalancer:
            servers:
              - url: "http://vllm-service.services.svc.cluster.local:8000"
        mlflow-backend:
          loadBalancer:
            servers:
              - url: "http://mlflow.services.svc.cluster.local:5000"
      middlewares:
        redirect-to-https:
          redirectScheme:
            scheme: https
            permanent: true
        security-headers:
          headers:
            contentTypeNosniff: true
            browserXssFilter: true
            customFrameOptionsValue: "SAMEORIGIN"
        vllm-strip-user-header:
          headers:
            customRequestHeaders:
              X-User-Id: ""
        vllm-forwardauth:
          forwardAuth:
            address: "http://127.0.0.1:8080/api/auth/vllm"
            trustForwardHeader: true
            authResponseHeaders:
              - "X-User-Id"
        vllm-ratelimit:
          rateLimit:
            average: 20
            burst: 5
            period: 1m
            sourceCriterion:
              requestHeaderName: "X-User-Id"
        vllm-inflight:
          inFlightReq:
            amount: 15

