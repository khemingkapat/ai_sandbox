apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-security-config
  namespace: slurm
data:
  security.yaml: |
    tls:
      stores:
        default:
          defaultCertificate:
            certFile: /etc/traefik/certs/tls.crt
            keyFile: /etc/traefik/certs/tls.key

    http:
      middlewares:
        security-headers:
          headers:
            contentTypeNosniff: true
            browserXssFilter: true
            customFrameOptionsValue: "SAMEORIGIN"
