apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-security-config
  namespace: slurm
data:
  security.yaml: |
    tls:
      stores:
        default:
          defaultCertificate:
            certFile: /etc/traefik/certs/tls.crt
            keyFile: /etc/traefik/certs/tls.key

    http:
      routers:
        portal:
          entryPoints:
            - websecure
          rule: "PathPrefix(`/`)"
          service: portal-ui
          priority: 1
          middlewares:
            - security-headers
      services:
        portal-ui:
          loadBalancer:
            servers:
              - url: "http://127.0.0.1:8080"
      middlewares:
        security-headers:
          headers:
            contentTypeNosniff: true
            browserXssFilter: true
            customFrameOptionsValue: "SAMEORIGIN"
