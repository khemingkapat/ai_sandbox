apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-internal
  namespace: services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlflow-postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: mlflow
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: slurm
      podSelector:
        matchLabels:
          app: hpc-portal
    ports:
    - protocol: TCP
      port: 5432
