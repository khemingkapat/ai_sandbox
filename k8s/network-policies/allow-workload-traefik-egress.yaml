apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-workload-traefik-egress
  namespace: workload
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: slurm
      podSelector:
        matchLabels:
          app: hpc-portal
    ports:
    - protocol: TCP
      port: 443
