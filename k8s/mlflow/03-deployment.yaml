apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: services
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: central-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
    spec:
      nodeSelector:
        kubernetes.io/hostname: ai-worker1
      tolerations:
      - key: "slinky.slurm.net/managed-node"
        operator: "Exists"
        effect: "NoExecute"
      containers:
      - name: mlflow-server
        image: mlflow-server:latest
        imagePullPolicy: IfNotPresent
        command:
        - mlflow
        - server
        - --backend-store-uri
        - postgresql://mlflow:mlflowpassword@mlflow-postgres.services.svc.cluster.local:5432/mlflow
        - --artifacts-destination
        - /mnt/storage/artifacts
        - --serve-artifacts
        - --host
        - 0.0.0.0
        - --port
        - "5000"
        - --static-prefix
        - /mlflow
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 4Gi
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: artifacts
          mountPath: /mnt/storage/artifacts
      volumes:
      - name: artifacts
        persistentVolumeClaim:
          claimName: mlflow-artifacts-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: services
  labels:
    app.kubernetes.io/name: mlflow
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 5000
    targetPort: 5000
  selector:
    app.kubernetes.io/name: mlflow
